<!DOCTYPE html>
<html lang="hi-en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EdgeStudy — Class 12 ka poora syllabus, ek jagah</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--ink:#1b2a4a;--soft:#52607f;--paper:#faf6ec;--line:#e7dfc9;--gold:#b8863b;--gold-l:#f0dfb8;--green:#2f6b4f;--red:#a33d3d;--card:#fff;
--head:'Bricolage Grotesque',Georgia,sans-serif;--sans:'Figtree',-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.05rem/1.6 var(--sans);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3{font-family:var(--head);font-weight:800;line-height:1.05;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(2.7rem,8.5vw,5.4rem)}h2{font-size:clamp(1.7rem,4.5vw,2.6rem)}h3{font-size:1.25rem;line-height:1.2}
a{color:inherit}.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--paper)}
nav .wrap{display:flex;align-items:center;gap:4px;min-height:64px;flex-wrap:wrap}
.logo{font-family:var(--head);font-weight:800;font-size:1.4rem;text-decoration:none;margin-right:auto;letter-spacing:-.02em}.logo i{font-style:normal;color:var(--gold)}
nav a.l{text-decoration:none;padding:10px 12px;font-weight:500;font-size:.95rem;border-bottom:3px solid transparent;color:var(--gold-l)}
nav a.l:hover{color:#fff}nav a.l.on{color:#fff;border-bottom-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font:600 1rem var(--sans);cursor:pointer;text-decoration:none;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:none}
.btn.alt{background:transparent;color:var(--ink)}.btn.sm{min-height:40px;padding:0 16px;font-size:.92rem}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
nav .btn{background:var(--gold);border-color:var(--gold);color:var(--ink)}nav .btn.alt{background:transparent;color:var(--paper);border-color:var(--gold-l)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero2{padding:64px 0 56px;display:grid;gap:48px;grid-template-columns:1.25fr .75fr;align-items:center}
.ln{display:block;overflow:hidden;padding-bottom:.06em}.ln>span{display:block;transform:translateY(110%);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
.ln:nth-child(2)>span{animation-delay:.12s}.ln:nth-child(3)>span{animation-delay:.24s;color:var(--gold)}
@keyframes up{to{transform:none}}
.lead{font-size:1.2rem;color:var(--soft);max-width:30em;margin:24px 0 0;opacity:0;animation:fade .8s .6s forwards}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;opacity:0;animation:fade .8s .75s forwards}
@keyframes fade{to{opacity:1}}
.deck{background:var(--ink);color:var(--paper);border-radius:16px;padding:26px}
.deck .big{font:800 6rem/0.9 var(--head);color:var(--gold);letter-spacing:-.04em}
.deck p{margin:6px 0 18px;color:var(--gold-l)}
.deck a{display:flex;justify-content:space-between;align-items:center;min-height:50px;padding:0 4px;border-top:1px solid rgba(240,223,184,.25);text-decoration:none;font-weight:600;opacity:0;transform:translateX(16px);animation:slide .6s forwards}
.deck a:nth-of-type(1){animation-delay:.7s}.deck a:nth-of-type(2){animation-delay:.8s}.deck a:nth-of-type(3){animation-delay:.9s}.deck a:nth-of-type(4){animation-delay:1s}.deck a:nth-of-type(5){animation-delay:1.1s}
.deck a small{color:var(--gold-l);font-weight:400}.deck a:hover{color:var(--gold)}
@keyframes slide{to{opacity:1;transform:none}}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--card)}
.feat>div{padding:26px;border-right:2px solid var(--ink)}.feat>div:last-child{border-right:0}.feat p{margin:0;color:var(--soft)}
.two{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:24px}
.panel.nv{background:var(--ink);color:var(--paper);border-color:var(--ink)}.panel.nv p{color:var(--gold-l)}
section.s{padding:48px 0}
.subj{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:18px}
.sj{display:block;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:16px 18px;text-decoration:none;transition:border-color .2s,transform .2s}
.sj:hover,.sj.on{border-color:var(--ink);transform:translateY(-3px)}.sj.on{background:var(--gold-l)}
.sj small{color:var(--soft);display:block}
.chs{display:grid;gap:8px;margin-top:20px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 16px;text-decoration:none;min-height:50px}
.ch.live{border-color:var(--green)}.ch em{font-style:normal;font-size:.85rem;color:var(--soft)}.ch.live em{color:var(--green);font-weight:600}
.box{max-width:480px;margin:48px auto}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:.95rem}
input,textarea,select{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:48px}
input:focus,textarea:focus{border-color:var(--ink);outline:none}textarea{min-height:120px;resize:vertical}
.msg{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:.92rem;background:var(--gold-l)}.msg.err{background:#f6dcdc;color:var(--red)}.msg.ok{background:#dcefe4;color:var(--green)}
.tk{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px;text-decoration:none}
.tk:hover{border-color:var(--ink)}.st{font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:6px;background:var(--gold-l)}
.st.answered{background:#dcefe4;color:var(--green)}.st.closed{background:#e8e8e8;color:#666}
.thread{display:flex;flex-direction:column;gap:12px;margin:20px 0;max-height:60vh;overflow:auto;padding:4px}
.b{max-width:82%;padding:10px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line);animation:pop .25s}
.b.f{align-self:flex-start;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.b.me{align-self:flex-end;background:var(--gold-l);border-color:var(--gold-l)}
.b small{display:block;opacity:.7;font-size:.75rem;margin-top:4px}.b img,.b video{max-width:100%;border-radius:8px;margin-top:6px;display:block}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.comp{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}.comp textarea{flex:1;min-height:48px;height:48px;min-width:200px}
.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.lock{background:var(--gold-l);border-radius:10px;padding:14px 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
footer{background:var(--ink);color:var(--gold-l);padding:28px 0 40px;font-size:.92rem;margin-top:48px}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
@media(max-width:800px){.hero2,.two,.feat{grid-template-columns:1fr}.feat>div{border-right:0;border-bottom:2px solid var(--ink)}.feat>div:last-child{border-bottom:0}.hero2{padding-top:36px}.b{max-width:92%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<nav><div class="wrap" id="nav"></div></nav>
<main id="app"></main>
<footer><div class="wrap">EdgeStudy · CBSE Class 12 ke students ke liye.</div></footer>

<script>
/* ====== 1. SETUP — apna Supabase URL aur anon key yahan daalo ====== */
const SB_URL='https://xnlpqhxkqeockawecrlm.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhubHBxaHhrcWVvY2thd2VjcmxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NzA1ODEsImV4cCI6MjEwNzA0NjU4MX0.sXuA1wnH46l-R2BqUz3MKp07hPhKSV7w_yF-fV6WE_4';
const FOUNDER_NAME='Alok';

/* ====== 2. CONTENT — chapters baad mein yahan add karo ======
   Chapter ready ho jaye toh url: 'notes/physics/nuclei.html' likh do. null = "jaldi aa raha hai". */
const SUBJECTS=[
 {name:'Physics',chapters:['Electric Charges and Fields','Electrostatic Potential and Capacitance','Current Electricity','Moving Charges and Magnetism','Magnetism and Matter','Electromagnetic Induction','Alternating Current','Electromagnetic Waves','Ray Optics','Wave Optics','Dual Nature of Radiation and Matter','Atoms','Nuclei','Semiconductor Electronics'].map(t=>({t,url:null}))},
 {name:'Chemistry',chapters:[]},{name:'Mathematics',chapters:[]},{name:'Biology',chapters:[]},{name:'English',chapters:[]}
];

let sb=null;
try{if(SB_URL.startsWith('http')&&window.supabase)sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){console.error(e)}
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,prof=null,rt=null;
const go=h=>location.hash=h;
const fmt=d=>new Date(d).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const say=(el,t,k='err')=>{el.className='msg '+k;el.textContent=t;el.hidden=false};

async function init(){
  window.onhashchange=route;
  if(!sb){route();return}
  const {data}=await sb.auth.getSession(); await setUser(data.session?.user);
  sb.auth.onAuthStateChange(async(_,s)=>{await setUser(s?.user);route()});
  window.onhashchange=route; route();
}
async function setUser(u){
  me=u||null;prof=null;
  if(me){const {data}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();prof=data}
}
function navbar(){
  const r=location.hash||'#/';const L=(h,t)=>`<a class="l ${r===h?'on':''}" href="${h}">${t}</a>`;
  $('#nav').innerHTML=`<a class="logo" href="#/">Edge<i>Study</i></a>${L('#/subjects','Subjects')}${me?L('#/contact','Founder se baat'):''}${prof?.is_admin?L('#/admin','Inbox'):''}
  ${me?`<button class="btn sm alt" id="out">Logout</button>`:`${L('#/login','Login')}<a class="btn sm" href="#/signup">Sign up</a>`}`;
  $('#out')?.addEventListener('click',()=>sb.auth.signOut().then(()=>go('#/')));
}
function route(){
  if(rt){sb.removeChannel(rt);rt=null}
  navbar();scrollTo(0,0);
  const [,p,id]=(location.hash||'#/').split('/');
  if(!sb&&['login','signup','contact','ticket','admin'].includes(p)){app.innerHTML='<div class="wrap box panel"><h3>Supabase abhi connect nahi hai</h3><p>index.html ke top par SB_URL aur SB_KEY daalo, phir login aur signup chalenge.</p></div>';return}
  const guard=['contact','ticket','admin'];
  if(guard.includes(p)&&!me)return go('#/login');
  if(p==='admin'&&!prof?.is_admin)return go('#/');
  ({'':home,subjects,login:()=>auth('login'),signup:()=>auth('signup'),contact,ticket:()=>ticket(id),admin}[p]||home)();
  observe();
}
function observe(){const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.15});document.querySelectorAll('.rv').forEach(n=>io.observe(n))}

/* ---------- Landing ---------- */
function home(){
  app.innerHTML=`<div class="wrap">
  <div class="hero2"><div>
    <h1><span class="ln"><span>Class 12 ka</span></span><span class="ln"><span>poora syllabus,</span></span><span class="ln"><span>ek jagah.</span></span></h1>
    <p class="lead">CBSE ke subjects aur chapters ke hisaab se saaf, seedhe notes. Padho, samjho, aur kuch atke toh founder se seedha pucho.</p>
    <div class="acts"><a class="btn gold" href="${me?'#/subjects':'#/signup'}">${me?'Subjects kholo':'Free account banao'}</a><a class="btn alt" href="#/subjects">Subjects dekho</a></div>
  </div>
  <aside class="deck"><div class="big">12</div><p>CBSE Class 12</p>
    ${SUBJECTS.map(s=>`<a href="#/subjects/${s.name}"><span>${s.name}</span><small>${s.chapters.length?s.chapters.length+' chapters':'Jaldi'}</small></a>`).join('')}</aside></div>

  <section class="s rv"><div class="feat">
    <div><h3>Chapter-wise</h3><p>Har subject ke chapters apne order mein, ek hi jagah.</p></div>
    <div><h3>Seedhi bhasha</h3><p>Hinglish mein, taaki padhte waqt dimaag par zor na pade.</p></div>
    <div><h3>Founder se seedha</h3><p>Koi support team nahi. Sawal poochho, jawab founder khud deta hai.</p></div></div></section>

  <section class="s rv"><div class="panel nv"><h3>Kuch samajh nahi aaya?</h3>
    <p>Ticket raise karo. ${FOUNDER_NAME} khud padhta hai aur khud jawab deta hai. Zaroorat padi toh wahi ticket mein chat bhi on kar deta hai, aur tum photo ya video bhi bhej sakte ho.</p>
    <a class="btn gold" href="${me?'#/contact':'#/signup'}">Founder ko likho</a></div></section></div>`;
}

/* ---------- Subjects ---------- */
function subjects(){
  const sel=decodeURIComponent((location.hash.split('/')[2])||'Physics');
  const s=SUBJECTS.find(x=>x.name===sel)||SUBJECTS[0];
  app.innerHTML=`<div class="wrap" style="padding-top:36px"><h2>Class 12 subjects</h2>
  <div class="subj">${SUBJECTS.map(x=>`<a class="sj ${x.name===s.name?'on':''}" href="#/subjects/${x.name}" style="text-decoration:none"><b>${x.name}</b><small>${x.chapters.length?x.chapters.length+' chapters':'Jaldi aa raha hai'}</small></a>`).join('')}</div>
  <div class="chs">${s.chapters.length?s.chapters.map(c=>c.url?`<a class="ch live" href="${me?c.url:'#/signup'}"><span>${esc(c.t)}</span><em>${me?'Padho':'Padhne ke liye sign up'}</em></a>`:`<div class="ch"><span>${esc(c.t)}</span><em>Jaldi aa raha hai</em></div>`).join(''):`<div class="panel">${s.name} ke chapters jaldi add honge. Account bana lo, taaki pehle pata chale.</div>`}</div></div>`;
}

/* ---------- Auth ---------- */
function auth(mode){
  if(me)return go('#/subjects');
  const su=mode==='signup';
  app.innerHTML=`<div class="wrap"><form class="box panel" id="f"><h2>${su?'Account banao':'Wapas aao'}</h2>
  ${su?`<label for="n">Naam</label><input id="n" required autocomplete="name">`:''}
  <label for="e">Email</label><input id="e" type="email" required autocomplete="email">
  <label for="p">Password</label><input id="p" type="password" minlength="6" required autocomplete="${su?'new-password':'current-password'}">
  <p style="margin:18px 0 0"><button class="btn" style="width:100%" id="go">${su?'Sign up':'Login'}</button></p><div class="msg" id="m" hidden></div>
  <p style="text-align:center;margin:16px 0 0">${su?'Account hai? <a href="#/login">Login karo</a>':'Naya ho? <a href="#/signup">Sign up karo</a>'}</p></form></div>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const b=$('#go'),m=$('#m');b.disabled=true;
    const em=$('#e').value.trim(),pw=$('#p').value;
    const r=su?await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:$('#n').value.trim()}}}):await sb.auth.signInWithPassword({email:em,password:pw});
    b.disabled=false;
    if(r.error)return say(m,r.error.message);
    if(su&&!r.data.session)return say(m,'Email check karo, confirm link bheja hai. Confirm karke login karo.','ok');
    go('#/subjects')};
}

/* ---------- Media helpers ---------- */
async function upload(file,tid){
  const path=`${me.id}/${tid}/${Date.now()}-${file.name.replace(/[^\w.-]/g,'_')}`;
  const {error}=await sb.storage.from('ticket-media').upload(path,file,{contentType:file.type});
  if(error)throw error;return {path,type:file.type};
}
async function media(path,type){
  if(!path)return'';const {data}=await sb.storage.from('ticket-media').createSignedUrl(path,3600);const u=data?.signedUrl;if(!u)return'';
  return type?.startsWith('image')?`<img src="${u}" alt="Attachment" loading="lazy">`:type?.startsWith('video')?`<video src="${u}" controls playsinline></video>`:`<a href="${u}" target="_blank" rel="noopener">Attachment kholo</a>`;
}

/* ---------- Contact founder ---------- */
async function contact(){
  const {data:ts}=await sb.from('tickets').select('*').eq('user_id',me.id).order('created_at',{ascending:false});
  app.innerHTML=`<div class="wrap" style="padding-top:36px"><div class="two" style="align-items:start">
  <form class="panel" id="f"><h2>Founder ko likho</h2><p style="color:var(--soft);margin:0">Problem jitni detail mein likhoge, utna accha jawab milega.</p>
    <label for="s">Topic</label><input id="s" required maxlength="120" placeholder="Jaise: Nuclei ka numerical samajh nahi aaya">
    <label for="b">Problem</label><textarea id="b" required></textarea>
    <label>Photo ya video (optional)</label><div class="btn alt file sm" style="width:100%">Fail chuno<input type="file" id="fi" accept="image/*,video/*"></div><small id="fn"></small>
    <p style="margin:18px 0 0"><button class="btn gold" id="go" style="width:100%">Ticket raise karo</button></p><div class="msg" id="m" hidden></div></form>
  <div><h2>Tumhare tickets</h2>${ts?.length?ts.map(t=>`<a class="tk" href="#/ticket/${t.id}"><span><b>${esc(t.subject)}</b><br><small>${fmt(t.created_at)}</small></span><span class="st ${t.status}">${t.status==='open'?'Jawab ka wait':t.status==='answered'?'Jawab aaya':'Band'}</span></a>`).join(''):'<div class="panel">Abhi koi ticket nahi. Pehla ticket yahan se raise karo.</div>'}</div></div></div>`;
  $('#fi').onchange=e=>$('#fn').textContent=e.target.files[0]?.name||'';
  $('#f').onsubmit=async e=>{e.preventDefault();const b=$('#go'),m=$('#m');b.disabled=true;
    try{
      const {data:t,error}=await sb.from('tickets').insert({user_id:me.id,subject:$('#s').value.trim()}).select().single();if(error)throw error;
      const f=$('#fi').files[0];const up=f?await upload(f,t.id):{};
      const r=await sb.from('ticket_messages').insert({ticket_id:t.id,sender_id:me.id,body:$('#b').value.trim(),media_path:up.path,media_type:up.type});if(r.error)throw r.error;
      go('#/ticket/'+t.id);
    }catch(x){say(m,x.message);b.disabled=false}};
}

/* ---------- Ticket thread (student + founder) ---------- */
async function ticket(id,adminView=false){
  const {data:t,error}=await sb.from('tickets').select('*').eq('id',id).maybeSingle();
  if(error||!t){app.innerHTML='<div class="wrap box panel">Ticket nahi mila.</div>';return}
  const isF=!!prof?.is_admin;
  const canType=isF?t.status!=='closed':(t.chat_enabled&&t.status!=='closed');
  app.innerHTML=`<div class="wrap" style="max-width:760px;padding-top:30px"><a href="${isF?'#/admin':'#/contact'}">← Wapas</a>
  <div class="row" style="margin-top:10px"><h2 style="margin:0">${esc(t.subject)}</h2><span class="st ${t.status}" id="st">${t.status}</span></div>
  ${isF?`<div class="row" style="margin-top:14px"><label style="margin:0;display:flex;gap:10px;align-items:center"><input type="checkbox" id="ce" style="width:22px;min-height:22px" ${t.chat_enabled?'checked':''}> Is ticket mein chat on karo</label><button class="btn sm alt" id="cl">${t.status==='closed'?'Dobara kholo':'Ticket band karo'}</button></div>`:''}
  <div class="thread" id="th"></div>
  ${canType?`<form class="comp" id="cf"><textarea id="cb" required placeholder="${isF?'Student ko jawab likho':'Apna message likho'}"></textarea><div class="btn alt file sm">Media<input type="file" id="cfi" accept="image/*,video/*"></div><button class="btn gold">Bhejo</button></form><small id="cfn"></small>`:
  `<div class="lock">${t.status==='closed'?'Ye ticket band hai.':'Chat abhi band hai. Founder jab chat on karega, tab yahin reply kar paoge. Jawab aate hi yahan dikhega.'}</div>`}</div>`;
  const th=$('#th');
  const add=async m=>{const mine=m.sender_id===me.id;const d=document.createElement('div');d.className='b '+(m.is_founder?'f':'')+(mine?' me':'');
    d.innerHTML=`
