<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10141e">
<meta name="description" content="EdgeStudy: Class 12 board exam prep with clear theory, important questions, quick revision, an automatic study journal, a smart planner and daily quests.">
<title>EdgeStudy | Class 12 Board Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/live.css">
<link rel="stylesheet" href="css/intro.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/glow.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/avatar.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<noscript><style>#boot{display:none}body.locked{overflow:auto}</style></noscript>
</head>
<body class="locked">

<div id="boot" aria-hidden="true">
  <div class="in-stage">
    <div class="atomwrap">
      <i class="in-glow"></i>
      <svg class="atomsvg" viewBox="-100 -100 200 200">
        <g transform="rotate(0)"><g class="orbit"><ellipse rx="88" ry="30" fill="none" stroke="#5ee2bc" stroke-opacity=".4" stroke-width="1.5"/><circle r="5.5" fill="#5ee2bc"><animateMotion dur="2.2s" repeatCount="indefinite" path="M-88 0a88 30 0 1 0 176 0a88 30 0 1 0 -176 0"/></circle></g></g>
        <g transform="rotate(60)"><g class="orbit" style="animation-delay:.15s"><ellipse rx="88" ry="30" fill="none" stroke="#b8a2ff" stroke-opacity=".4" stroke-width="1.5"/><circle r="5.5" fill="#b8a2ff"><animateMotion dur="2.8s" repeatCount="indefinite" path="M-88 0a88 30 0 1 0 176 0a88 30 0 1 0 -176 0"/></circle></g></g>
        <g transform="rotate(120)"><g class="orbit" style="animation-delay:.3s"><ellipse rx="88" ry="30" fill="none" stroke="#ffc36b" stroke-opacity=".4" stroke-width="1.5"/><circle r="5.5" fill="#ffc36b"><animateMotion dur="3.4s" repeatCount="indefinite" path="M-88 0a88 30 0 1 0 176 0a88 30 0 1 0 -176 0"/></circle></g></g>
        <circle class="nuc" r="24" fill="#5ee2bc"/><text y="9" text-anchor="middle" font-size="26" font-weight="800" fill="#10201d" font-family="system-ui,sans-serif">E</text>
      </svg>
      <span class="glyph" style="--c:#5ee2bc;--x:-150px;--y:-90px;--dl:.2s">Ph</span>
      <span class="glyph" style="--c:#b8a2ff;--x:150px;--y:-80px;--dl:.45s">Ch</span>
      <span class="glyph" style="--c:#ffc36b;--x:-140px;--y:90px;--dl:.7s">Ma</span>
      <span class="glyph" style="--c:#8dbbff;--x:150px;--y:90px;--dl:.95s">En</span>
      <span class="glyph" style="--c:#ffc0e1;--x:0px;--y:-135px;--dl:1.2s">Pa</span>
    </div>
    <div class="wordmark" aria-label="EdgeStudy"><span style="--i:0">E</span><span style="--i:1">d</span><span style="--i:2">g</span><span style="--i:3">e</span><span style="--i:4">S</span><span style="--i:5">t</span><span style="--i:6">u</span><span style="--i:7">d</span><span style="--i:8">y</span></div>
    <div class="in-bar"><i id="bootBar"></i></div>
    <div class="in-meta"><span id="bootLog">Sharpening pencils</span><span id="bootPct">00</span></div>
    <div class="in-skip">Tap to skip</div>
  </div>
</div>

<canvas id="field" aria-hidden="true"></canvas>
<div id="sweep" aria-hidden="true"></div>
<header class="topbar"><div class="wrap" id="nav"></div></header>
<div id="view"></div>
<nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>
<div id="toasts" aria-live="polite"></div>
<canvas id="spark" aria-hidden="true"></canvas>

<script>setTimeout(function(){var b=document.getElementById('boot');if(b){b.remove();document.body.classList.remove('locked')}},12000)</script>
<script src="js/store.js"></script>
<script src="js/fx.js"></script>
<script src="js/dots.js"></script>
<script src="js/intro.js"></script>
<script src="js/glow.js"></script>
<script src="js/chatkit.js"></script>
<script src="js/content.js"></script>
<script src="js/avatar.js"></script>
<script src="js/study.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
