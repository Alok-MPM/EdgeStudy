<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EdgeStudy | CBSE Class 12 study notes</title>
<meta name="description" content="Clear, chapter-wise CBSE Class 12 notes with direct help from the founder.">
<meta name="theme-color" content="#12214a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--ink:#12214a;--mute:#5a6685;--bg:#f5f7fb;--card:#fff;--line:#dfe5f0;--pri:#2456d8;--soft:#e8eefc;--ok:#1f7a52;--bad:#b3362f;--hd:'Manrope',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font:400 16px/1.6 'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--hd);font-weight:800;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,8vw,3.4rem)}h2{font-size:clamp(1.4rem,5.5vw,2rem)}h3{font-size:1.1rem}
a{color:inherit}p{color:var(--mute)}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}.pg{padding-top:24px;padding-bottom:24px}.narrow{max-width:600px}
header{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;gap:6px;height:56px}
.logo{font:800 1.3rem var(--hd);text-decoration:none;margin-right:auto}.logo i{font-style:normal;color:#8fb0ff}
.dl{display:none}
header a.l{text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:500;font-size:.95rem;color:#c9d6f5}header a.l.on{background:rgba(255,255,255,.12);color:#fff}
.tab{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tab a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;text-decoration:none;font-size:.72rem;font-weight:500;color:var(--mute)}
.tab a.on{color:var(--pri)}.tab svg,.eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:12px;border:2px solid var(--pri);background:var(--pri);color:#fff;font:600 1rem 'Inter',sans-serif;cursor:pointer;text-decoration:none;width:100%}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.6}.btn.alt{background:transparent;color:var(--pri)}.btn.sm{min-height:40px;padding:0 16px;font-size:.9rem;width:auto}
header .btn{background:#fff;border-color:#fff;color:var(--ink)}header .btn.alt{background:transparent;color:#fff;border-color:#5b6fa8}
:focus-visible{outline:3px solid #f2b134;outline-offset:2px}
.hero{background:var(--ink) repeating-linear-gradient(transparent 0 35px,rgba(143,176,255,.13) 35px 36px);color:#fff;position:relative;padding:44px 0 40px}
.hero:before{content:"";position:absolute;top:0;bottom:0;left:34px;width:2px;background:rgba(242,177,52,.55)}
.hero .wrap{position:relative;padding-left:56px;max-width:1040px}
.hero p{color:#c9d6f5;font-size:1.05rem;margin:14px 0 24px;max-width:34em}
.hero .acts{display:grid;gap:10px;max-width:340px}.hero .btn.alt{color:#fff;border-color:#5b6fa8}.hero .btn:not(.alt){background:#f2b134;border-color:#f2b134;color:var(--ink)}
.sec{padding:32px 0}.sec h2{margin-bottom:16px}
.grid{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.card h3{margin-bottom:6px}.card p{font-size:.95rem}
.step{display:flex;gap:14px;align-items:flex-start}.step b{flex:none;width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--pri);display:grid;place-items:center;font:800 .95rem var(--hd)}
.cta{background:var(--soft);border-radius:18px;padding:24px 20px}.cta p{margin:6px 0 16px;color:var(--ink)}
.empty{text-align:center;padding:36px 20px}.empty p{margin:8px 0 18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:#fff;text-decoration:none;font-weight:500;font-size:.92rem}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-height:52px;margin-bottom:8px;text-decoration:none}
.ch em{font-style:normal;font-size:.82rem;color:var(--mute)}.ch.live em{color:var(--ok);font-weight:600}
label{display:block;font-weight:600;font-size:.92rem;margin:14px 0 6px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-height:48px}
input:focus,textarea:focus{border-color:var(--pri);outline:none}input:disabled{background:var(--bg);color:var(--mute)}textarea{min-height:120px;resize:vertical}
.pw{position:relative}.pw input{padding-right:50px}.eye{position:absolute;right:2px;top:0;width:48px;height:48px;border:0;background:none;color:var(--mute);cursor:pointer;display:grid;place-items:center}
form .btn{margin-top:18px}
.msg{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:.92rem;background:var(--soft)}.msg.err{background:#fbe4e2;color:var(--bad)}.msg.ok{background:#dff1e8;color:var(--ok)}
.hint{font-size:.85rem;margin-top:6px;min-height:1.2em}.hint.err{color:var(--bad)}.hint.ok{color:var(--ok)}
.tk{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;text-decoration:none}
.tk small{color:var(--mute)}.st{flex:none;font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:99px;background:#fdf0d2;color:#8a5a00}.st.answered{background:#dff1e8;color:var(--ok)}.st.closed{background:#ececf1;color:#666}
.thread{display:flex;flex-direction:column;gap:10px;margin:18px 0}
.b{max-width:88%;padding:10px 14px;border-radius:16px;background:#fff;border:1px solid var(--line);overflow-wrap:anywhere}
.b.f{align-self:flex-start;background:var(--ink);color:#fff;border-color:var(--ink)}.b.me{align-self:flex-end;background:var(--soft);border-color:var(--soft)}
.b small{display:block;opacity:.7;font-size:.74rem;margin-top:4px}.b img,.b video{max-width:100%;border-radius:10px;margin-top:6px;display:block}
.comp{display:grid;gap:8px}.comp textarea{min-height:80px}
.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.lock{background:#fdf0d2;border-radius:12px;padding:14px 16px;font-size:.92rem}
.who{display:flex;gap:14px;align-items:center;margin-bottom:18px}.av{width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font:800 1.5rem var(--hd);flex:none}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
footer{padding:24px 0 8px;color:var(--mute);font-size:.88rem;text-align:center}
@media(min-width:760px){
 body{padding-bottom:0}.tab{display:none}.dl{display:inline}
 .hero{padding:80px 0 72px}.hero .acts{display:flex;max-width:none}.hero .btn{width:auto}
 .grid.c3{grid-template-columns:repeat(3,1fr)}.btn{width:auto}form .btn,.cta .btn{width:100%}.cta .btn{width:auto}
 .pg{padding-top:40px}.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}.comp{grid-template-columns:1fr auto auto;align-items:end}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="wrap" id="nav"></div></header>
<main id="app"></main>
<footer><div class="wrap">&copy; EdgeStudy. Study notes for CBSE Class 12.</div></footer>
<nav class="tab" id="tab" aria-label="Main"></nav>

<script>
/* ===== SETUP ===== */
const SB_URL='https://xnlpqhxkqeockawecrlm.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhubHBxaHhrcWVvY2thd2VjcmxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NzA1ODEsImV4cCI6MjEwNzA0NjU4MX0.sXuA1wnH46l-R2BqUz3MKp07hPhKSV7w_yF-fV6WE_4';

/* ===== CONTENT: subjects and chapters are empty for now. Add later like this:
   {name:'Physics',chapters:[{t:'Nuclei',url:'notes/physics/nuclei.html'},{t:'Atoms',url:null}]}
   url:null shows "Coming soon". ===== */
const SUBJECTS=[];

let sb=null;try{if(window.supabase)sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){console.error(e)}
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,prof=null,rt=null;
const go=h=>location.hash=h;
const fmt=d=>new Date(d).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const say=(el,t,k='err')=>{el.className='msg '+k;el.textContent=t;el.hidden=false};
const I={home:'<path d="M3 11l9-8 9 8v10H3z"/>',book:'<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/>',help:'<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6A8 8 0 1 1 21 12z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
eye:'<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',off:'<path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18 18 0 0 1 5.1-5.9M9.9 5.1A10.7 10.7 0 0 1 12 5c7 0 11 7 11 7a18 18 0 0 1-2.2 3.2M1 1l22 22"/>'};
const svg=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const pwf=(id,label,ac)=>`<label for="${id}">${label}</label><div class="pw"><input id="${id}" type="password" minlength="6" required autocomplete="${ac}"><button type="button" class="eye" data-t="${id}" aria-label="Show password">${svg('eye')}</button></div>`;
document.addEventListener('click',e=>{const b=e.target.closest('.eye');if(!b)return;const i=document.getElementById(b.dataset.t),s=i.type==='password';i.type=s?'text':'password';b.innerHTML=svg(s?'off':'eye');b.setAttribute('aria-label',s?'Hide password':'Show password')});

async function init(){
  window.onhashchange=route;
  if(!sb){route();return}
  const {data}=await sb.auth.getSession();await setUser(data.session?.user);
  sb.auth.onAuthStateChange(async(_,s)=>{await setUser(s?.user);route()});
  route();
}
async function setUser(u){me=u||null;prof=null;if(me){const {data}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();prof=data}}
function navbar(){
  const r=(location.hash||'#/').split('/')[1]||'';const on=k=>r===k?'on':'';
  const L=(h,k,t)=>`<a class="l ${on(k)}" href="${h}">${t}</a>`;
  $('#nav').innerHTML=`<a class="logo" href="#/">Edge<i>Study</i></a><span class="dl">${L('#/subjects','subjects','Subjects')}${me?L('#/help','help','Ask the founder')+L('#/profile','profile','Profile'):''}</span>
  ${me?'':`<a class="btn sm alt" href="#/login">Log in</a><a class="btn sm" href="#/signup">Sign up</a>`}`;
  const T=(h,k,ic,t)=>`<a class="${on(k)}" href="${h}">${svg(ic)}<span>${t}</span></a>`;
  $('#tab').innerHTML=T('#/','','home','Home')+T('#/subjects','subjects','book','Subjects')+T('#/help','help','help','Help')+(me?T('#/profile','profile','user','Profile'):T('#/login','login','user','Log in'));
}
function route(){
  if(rt){sb.removeChannel(rt);rt=null}
  navbar();scrollTo(0,0);
  const [,p,id]=(location.hash||'#/').split('/');
  if(!sb&&['login','signup','help','ticket','profile'].includes(p)){app.innerHTML='<div class="wrap pg narrow"><div class="card empty"><h3>Service unavailable</h3><p>Could not connect. Check your internet and reload the page.</p></div></div>';return}
  if(['help','ticket','profile'].includes(p)&&!me)return go('#/login');
  ({'':home,subjects,login:()=>auth('login'),signup:()=>auth('signup'),help,ticket:()=>ticket(id),profile}[p]||home)();
}

/* ---------- Home ---------- */
function home(){
  app.innerHTML=`<section class="hero"><div class="wrap"><h1>Class 12 notes that make sense.</h1>
  <p>Chapter-wise CBSE notes in simple language. Stuck on something? Ask the founder directly.</p>
  <div class="acts"><a class="btn" href="${me?'#/subjects':'#/signup'}">${me?'Browse subjects':'Create free account'}</a><a class="btn alt" href="#/subjects">View subjects</a></div></div></section>
  <div class="wrap"><section class="sec"><h2>Built for exam preparation</h2><div class="grid c3">
   <div class="card"><h3>Chapter-wise notes</h3><p>Every subject is split into its chapters, so you open exactly what you need.</p></div>
   <div class="card"><h3>Simple language</h3><p>Short explanations and clear steps, with no jargon to slow you down.</p></div>
   <div class="card"><h3>Direct help</h3><p>No support queue. Send a question and the founder replies personally.</p></div></div></section>
  <section class="sec"><h2>How it works</h2>
   <div class="card step"><b>1</b><div><h3>Create a free account</h3><p>It takes under a minute.</p></div></div>
   <div class="card step"><b>2</b><div><h3>Pick a subject and chapter</h3><p>Read the notes at your own pace, on any phone.</p></div></div>
   <div class="card step"><b>3</b><div><h3>Ask when you're stuck</h3><p>Raise a ticket with text, a photo or a video.</p></div></div></section>
  <section class="sec"><div class="cta"><h2>Have a doubt?</h2><p>Send it to the founder. Add a photo of your working if it helps.</p><a class="btn" href="${me?'#/help':'#/signup'}">${me?'Ask the founder':'Sign up to ask'}</a></div></section></div>`;
}

/* ---------- Subjects ---------- */
function subjects(){
  if(!SUBJECTS.length){app.innerHTML=`<div class="wrap pg narrow"><h1 style="font-size:1.8rem;margin-bottom:16px">Subjects</h1><div class="card empty"><h3>Notes are on the way</h3><p>We are preparing chapter-wise notes for Class 12. They will appear here as soon as they are published.</p>${me?'':'<a class="btn" href="#/signup">Create free account</a>'}</div></div>`;return}
  const sel=decodeURIComponent(location.hash.split('/')[2]||SUBJECTS[0].name),s=SUBJECTS.find(x=>x.name===sel)||SUBJECTS[0];
  app.innerHTML=`<div class="wrap pg narrow"><h1 style="font-size:1.8rem;margin-bottom:16px">Subjects</h1>
  <div class="chips">${SUBJECTS.map(x=>`<a class="chip ${x.name===s.name?'on':''}" href="#/subjects/${encodeURIComponent(x.name)}">${esc(x.name)}</a>`).join('')}</div>
  ${s.chapters.length?s.chapters.map(c=>c.url?`<a class="ch live" href="${me?esc(c.url):'#/signup'}"><span>${esc(c.t)}</span><em>${me?'Read':'Sign up to read'}</em></a>`:`<div class="ch"><span>${esc(c.t)}</span><em>Coming soon</em></div>`).join(''):`<div class="card empty"><p>Chapters for ${esc(s.name)} will be added soon.</p></div>`}</div>`;
}

/* ---------- Auth ---------- */
function auth(mode){
  if(me)return go('#/subjects');
  const su=mode==='signup';
  app.innerHTML=`<div class="wrap pg narrow"><form class="card" id="f"><h2>${su?'Create your account':'Welcome back'}</h2>
  ${su?'<label for="n">Full name</label><input id="n" required maxlength="60" autocomplete="name">':''}
  <label for="e">Email</label><input id="e" type="email" required autocomplete="email" inputmode="email">
  ${pwf('p','Password',su?'new-password':'current-password')}${su?pwf('p2','Confirm password','new-password')+'<div class="hint" id="h"></div>':''}
  <button class="btn" id="go">${su?'Sign up':'Log in'}</button><div class="msg" id="m" hidden></div>
  <p style="text-align:center;margin-top:16px">${su?'Already have an account? <a href="#/login">Log in</a>':'New here? <a href="#/signup">Create an account</a>'}</p></form></div>`;
  if(su){const chk=()=>{const h=$('#h'),a=$('#p').value,b=$('#p2').value;if(!b){h.textContent='';return}const ok=a===b;h.className='hint '+(ok?'ok':'err');h.textContent=ok?'Passwords match':'Passwords do not match'};$('#p').oninput=$('#p2').oninput=chk}
  $('#f').onsubmit=async e=>{e.preventDefault();const b=$('#go'),m=$('#m'),pw=$('#p').value;
    if(su&&pw!==$('#p2').value)return say(m,'Passwords do not match. Please re-enter them.');
    b.disabled=true;const em=$('#e').value.trim();
    const r=su?await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:$('#n').value.trim()}}}):await sb.auth.signInWithPassword({email:em,password:pw});
    b.disabled=false;if(r.error)return say(m,r.error.message);
    if(su&&!r.data.session)return say(m,'Account created. Check your email to confirm it, then log in.','ok');
    go('#/subjects')};
}

/* ---------- Profile ---------- */
function profile(){
  const n=prof?.full_name||me.user_metadata?.full_name||'';
  app.innerHTML=`<div class="wrap pg narrow"><div class="who"><div class="av">${esc((n||me.email)[0].toUpperCase())}</div><div><h2>${esc(n||'Student')}</h2><p style="font-size:.92rem;overflow-wrap:anywhere">${esc(me.email)}</p></div></div>
  <form class="card" id="pf"><h3>Your details</h3><label for="pn">Full name</label><input id="pn" required maxlength="60" value="${esc(n)}" autocomplete="name"><label for="pe">Email</label><input id="pe" value="${esc(me.email)}" disabled>
   <button class="btn">Save changes</button><div class="msg" id="pm" hidden></div></form>
  <form class="card" id="pw"><h3>Change password</h3>${pwf('np','New password','new-password')}${pwf('np2','Confirm new password','new-password')}<button class="btn">Update password</button><div class="msg" id="wm" hidden></div></form>
  <a class="card tk" href="#/help"><span><b>My tickets</b><br><small>See your questions and replies</small></span></a>
  <button class="btn alt" id="lo" style="margin-top:6px">Log out</button></div>`;
  $('#pf').onsubmit=async e=>{e.preventDefault();const m=$('#pm'),v=$('#pn').value.trim();
    const [a,b]=await Promise.all([sb.from('profiles').update({full_name:v}).eq('id',me.id),sb.auth.updateUser({data:{full_name:v}})]);
    if(a.error||b.error)return say(m,(a.error||b.error).message);prof={...prof,full_name:v};say(m,'Changes saved.','ok')};
  $('#pw').onsubmit=async e=>{e.preventDefault();const m=$('#wm');
    if($('#np').value!==$('#np2').value)return say(m,'Passwords do not match. Please re-enter them.');
    const r=await sb.auth.updateUser({password:$('#np').value});if(r.error)return say(m,r.error.message);e.target.reset();say(m,'Password updated.','ok')};
  $('#lo').onclick=()=>sb.auth.signOut().then(()=>go('#/'));
}

/* ---------- Media ---------- */
async function upload(file,tid){
  const path=`${me.id}/${tid}/${Date.now()}-${file.name.replace(/[^\w.-]/g,'_')}`;
  const {error}=await sb.storage.from('ticket-media').upload(path,file,{contentType:file.type});if(error)throw error;return{path,type:file.type};
}
async function media(path,type){
  if(!path)return'';const {data}=await sb.storage.from('ticket-media').createSignedUrl(path,3600);const u=data?.signedUrl;if(!u)return'';
  return type?.startsWith('image')?`<img src="${u}" alt="Attachment" loading="lazy">`:type?.startsWith('video')?`<video src="${u}" controls playsinline></video>`:`<a href="${u}" target="_blank" rel="noopener">Open attachment</a>`;
}
const SL={open:'Awaiting reply',answered:'Answered',closed:'Closed'};

/* ---------- Ask the founder ---------- */
async function help(){
  const {data:ts}=await sb.from('tickets').select('*').eq('user_id',me.id).order('created_at',{ascending:false});
  app.innerHTML=`<div class="wrap pg"><div class="two"><form class="card" id="f"><h2>Ask the founder</h2><p style="margin-top:4px">The more detail you share, the better the answer.</p>
   <label for="s">Topic</label><input id="s" required maxlength="120" placeholder="e.g. Numerical on nuclei">
   <label for="b">Your question</label><textarea id="b" required></textarea>
   <label>Photo or video (optional)</label><div class="btn alt file sm" style="width:100%">Choose file<input type="file" id="fi" accept="image/*,video/*"></div><small id="fn" style="color:var(--mute)"></small>
   <button class="btn" id="go">Send question</button><div class="msg" id="m" hidden></div></form>
  <div><h2 style="margin-bottom:12px">Your tickets</h2>${ts?.length?ts.map(t=>`<a class="tk" href="#/ticket/${t.id}"><span><b>${esc(t.subject)}</b><br><small>${fmt(t.created_at)}</small></span><span class="st ${t.status}">${SL[t.status]||t.status}</span></a>`).join(''):'<div class="card empty"><p style="margin:0">No tickets yet. Your questions will show up here.</p></div>'}</div></div></div>`;
  $('#fi').onchange=e=>$('#fn').textContent=e.target.files[0]?.name||'';
  $('#f').onsubmit=async e=>{e.preventDefault();const b=$('#go'),m=$('#m');b.disabled=true;
    try{const {data:t,error}=await sb.from('tickets').insert({user_id:me.id,subject:$('#s').value.trim()}).select().single();if(error)throw error;
      const f=$('#fi').files[0],up=f?await upload(f,t.id):{};
      const r=await sb.from('ticket_messages').insert({ticket_id:t.id,sender_id:me.id,body:$('#b').value.trim(),media_path:up.path,media_type:up.type});if(r.error)throw r.error;go('#/ticket/'+t.id);
    }catch(x){say(m,x.message);b.disabled=false}};
}

/* ---------- Ticket thread ---------- */
async function ticket(id){
  const {data:t,error}=await sb.from('tickets').select('*').eq('id',id).maybeSingle();
  if(error||!t){app.innerHTML='<div class="wrap pg narrow"><div class="card empty"><h3>Ticket not found</h3><a class="btn" href="#/help">Back to tickets</a></div></div>';return}
  const canType=t.chat_enabled&&t.status!=='closed';
  app.innerHTML=`<div class="wrap pg narrow"><a href="#/help" style="text-decoration:none;color:var(--pri);font-weight:600">&larr; Back</a>
  <div class="row" style="margin-top:12px"><h2>${esc(t.subject)}</h2><span class="st ${t.status}">${SL[t.status]||t.status}</span></div><div class="thread" id="th"></div>
  ${canType?`<form class="comp" id="cf"><textarea id="cb" required placeholder="Write your message"></textarea><div class="btn alt file sm">Add media<input type="file" id="cfi" accept="image/*,video/*"></div><button class="btn sm">Send</button></form><small id="cfn" style="color:var(--mute)"></small>`:`<div class="lock">${t.status==='closed'?'This ticket is closed.':'Replies are off for now. When the founder turns on chat, you can reply here. The answer will appear on this page.'}</div>`}</div>`;
  const th=$('#th');
  const add=async m=>{const d=document.createElement('div');d.className='b '+(m.is_founder?'f':'me');
    d.innerHTML=`${esc(m.body).replace(/\n/g,'<br>')}${await media(m.media_path,m.media_type)}<small>${m.is_founder?'Founder':'You'} &middot; ${fmt(m.created_at)}</small>`;th.appendChild(d);scrollTo(0,document.body.scrollHeight)};
  const {data:ms}=await sb.from('ticket_messages').select('*').eq('ticket_id',id).order('created_at');
  for(const m of ms||[])await add(m);
  const seen=new Set((ms||[]).map(m=>m.id));
  rt=sb.channel('t'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'ticket_messages',filter:`ticket_id=eq.${id}`},p=>{if(!seen.has(p.new.id)){seen.add(p.new.id);add(p.new)}})
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'tickets',filter:`id=eq.${id}`},()=>ticket(id)).subscribe();
  $('#cfi')&&($('#cfi').onchange=e=>$('#cfn').textContent=e.target.files[0]?.name||'');
  $('#cf')&&($('#cf').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;
    try{const f=$('#cfi').files[0],up=f?await upload(f,id):{};
      const {data:m,error}=await sb.from('ticket_messages').insert({ticket_id:id,sender_id:me.id,is_founder:false,body:$('#cb').value.trim(),media_path:up.path,media_type:up.type}).select().single();
      if(error)throw error;seen.add(m.id);await add(m);$('#cb').value='';$('#cfi').value='';$('#cfn').textContent='';
    }catch(x){alert(x.message)}btn.disabled=false});
}
init();
</script>
