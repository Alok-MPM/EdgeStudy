<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10141e">
<meta name="description" content="EdgeStudy: Class 12 board exam prep with clear theory, important questions and quick revision, plus direct help from the founder.">
<title>EdgeStudy | Class 12 Board Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<noscript><style>#intro{display:none}body.locked{overflow:auto}</style></noscript>
<style>
/* =========================================================
   EdgeStudy design system
   No pointer-hover states anywhere. Motion comes from scroll only.
   ========================================================= */
:root{
  color-scheme:dark;
  --bg:#10141e;--text:#f5f7fb;--muted:#a4afc0;--dim:#6f7b8e;
  --mint:#5ee2bc;--amber:#ffc36b;--violet:#b8a2ff;--coral:#ff8f83;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --ease:cubic-bezier(.16,1,.3,1);
  --hd:'Bricolage Grotesque',system-ui,sans-serif;
  --bd:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--text);font:400 16px/1.6 var(--bd);overflow-x:hidden;min-height:100vh;-webkit-font-smoothing:antialiased}
/* graph-paper texture: exam-sheet vernacular, fades out down the page */
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 90% 70% at 50% 0,#000 20%,transparent 75%)}
body.locked{overflow:hidden}
body.hasTab{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
h1,h2,h3{font-family:var(--hd);font-weight:700;line-height:1.04;letter-spacing:-.035em;text-wrap:balance}
h1{font-size:clamp(2.7rem,10.5vw,6rem);font-weight:750;letter-spacing:-.05em}
h2{font-size:clamp(2rem,6.2vw,3.6rem);letter-spacing:-.045em}
h3{font-size:1.15rem;letter-spacing:-.02em;line-height:1.2}
p{color:var(--muted);text-wrap:pretty}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:8px}
.wrap{width:min(1180px,calc(100% - 32px));margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Glass surfaces ---------- */
.glass,.sc,.cc,.box,.lesson,.tk,.card,.pitch,.sidebar{
  --a:var(--mint);position:relative;
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.012) 60%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--line2);border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 40px 80px -40px rgba(0,0,0,.7);
}
.tint{background:radial-gradient(120% 90% at 100% 0,color-mix(in srgb,var(--a) 16%,transparent),transparent 55%),linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01) 60%)}

/* ---------- Intro loader ---------- */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center}
#intro.gone{display:none}
.ip{position:absolute;left:0;right:0;height:50.2%;background:var(--bg);transition:transform 1.15s var(--ease) .28s}
.ip-t{top:0}.ip-b{bottom:0}
.iseam{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--mint);transform:scaleX(0);opacity:0}
.ic{position:relative;z-index:2;display:grid;justify-items:center;gap:26px;transition:opacity .45s ease,transform .8s var(--ease),filter .5s ease}
.imark{width:76px;height:76px;overflow:visible}
.imark .frame{fill:none;stroke:var(--line2);stroke-width:1.5;stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1.1s var(--ease) .1s forwards}
.imark .bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:bar .8s var(--ease) forwards}
.imark .spine{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);animation:spine .7s var(--ease) .35s forwards}
.imark .b1{animation-delay:.55s}.imark .b2{animation-delay:.68s}.imark .b3{animation-delay:.81s}
.iword{display:flex;font:700 clamp(2rem,6vw,2.8rem)/1 var(--hd);letter-spacing:-.04em;overflow:hidden;padding-bottom:.08em}
.iword span{display:inline-block;transform:translateY(110%);animation:rise .9s var(--ease) forwards;animation-delay:calc(.75s + var(--k) * 45ms)}
.iword span.s{color:var(--mint)}
.ibar{width:220px;height:1px;background:var(--line2);overflow:hidden}
.ibar i{display:block;height:100%;background:var(--mint);transform:scaleX(0);transform-origin:left}
.imeta{width:220px;display:flex;justify-content:space-between;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-variant-numeric:tabular-nums;opacity:0;animation:fade .6s ease 1s forwards}
#intro.quick *{animation-duration:.35s!important;animation-delay:0s!important}
#intro.out .ic{opacity:0;transform:translateY(-28px) scale(.97);filter:blur(6px)}
#intro.out .iseam{animation:seam .9s var(--ease) forwards}
#intro.out .ip-t{transform:translateY(-100%)}
#intro.out .ip-b{transform:translateY(100%)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes bar{to{transform:scaleX(1)}}
@keyframes spine{to{transform:scaleY(1)}}
@keyframes rise{to{transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes seam{0%{transform:scaleX(0);opacity:1}55%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}

/* ---------- Scroll reveal engine ---------- */
.rv{opacity:0;transform:translate3d(0,34px,0);transition:opacity 1s var(--ease),transform 1.15s var(--ease),filter 1s var(--ease);transition-delay:calc(var(--i,0) * 85ms)}
.rv[data-rv=scale]{transform:translate3d(0,26px,0) scale(.94)}
.rv[data-rv=blur]{filter:blur(10px);transform:translate3d(0,14px,0)}
.rv[data-rv=left]{transform:translate3d(-36px,0,0)}
.rv[data-rv=right]{transform:translate3d(36px,0,0)}
.rv.in{opacity:1;transform:none;filter:none}
.split .mw{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em}
.split .mw>span{display:inline-block;transform:translate3d(0,112%,0) rotate(5deg);transform-origin:0 100%;transition:transform 1.25s var(--ease);transition-delay:calc(var(--i,0) * 75ms + 60ms)}
.split.in .mw>span{transform:none}
.layer{will-change:transform}
#view.enter{animation:viewIn .6s var(--ease)}
@keyframes viewIn{from{opacity:0}to{opacity:1}}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top);border-bottom:1px solid transparent;transition:background-color .5s ease,border-color .5s ease}
.topbar.scrolled{background:rgba(16,20,30,.72);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-color:var(--line)}
#nav{min-height:68px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font:700 1.15rem var(--hd);letter-spacing:-.03em;margin-right:auto}
.logo{width:32px;height:32px;flex:none}
.navl{display:none;gap:2px;margin-right:10px}
.navl a{padding:8px 12px;color:var(--muted);font-size:.9rem;border-radius:10px}

/* ---------- Buttons & small parts ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-weight:600;font-size:.92rem;white-space:nowrap;transition:transform .2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--mint);border-color:var(--mint);color:var(--bg)}
.btn.sm{min-height:38px;padding:0 14px;font-size:.84rem;border-radius:11px}
.btn.block{width:100%}.btn[disabled]{opacity:.55}
.av{width:36px;height:36px;border-radius:50%;background:var(--mint);color:var(--bg);display:grid;place-items:center;font:700 .95rem var(--hd);flex:none}
.eyebrow{display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 11px;border-radius:99px;border:1px solid color-mix(in srgb,var(--mint) 28%,transparent);background:color-mix(in srgb,var(--mint) 7%,transparent);color:var(--mint);font-size:.8rem;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mint);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--mint) 55%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}
.kicker{display:inline-flex;align-items:center;gap:12px;color:var(--mint);font-size:.74rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.kicker:before{content:"";width:24px;height:1px;background:currentColor}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:color-mix(in srgb,var(--a) 14%,transparent);color:var(--a);font-weight:600;font-size:.76rem;width:max-content}
.tl{color:var(--mint);font-size:.85rem;font-weight:600}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dots i{width:9px;height:9px;border-radius:3px;background:color-mix(in srgb,var(--a) 18%,transparent)}
.in .dots i,.dots.in i{animation:dotOn .6s var(--ease) both;animation-delay:calc(var(--k) * 35ms + 350ms)}
@keyframes dotOn{from{transform:scale(.3);background:color-mix(in srgb,var(--a) 18%,transparent)}to{transform:none;background:color-mix(in srgb,var(--a) 80%,transparent)}}

/* ---------- Hero ---------- */
.hero{padding:36px 0 72px;position:relative}
.heroGrid{display:grid;gap:64px}
.hero h1{margin:24px 0}
.hero h1 em{font-style:normal;color:var(--mint);position:relative;display:inline-block;white-space:nowrap}
.hero h1 em:after{content:"";position:absolute;left:.04em;right:.04em;bottom:.02em;height:.07em;border-radius:99px;background:var(--amber);transform:scaleX(0);transform-origin:left;transition:transform 1.1s var(--ease) 1s}
.hero h1.in em:after{transform:scaleX(1)}
.lead{font-size:1.08rem;max-width:31em;line-height:1.65}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px}
.facts{display:flex;gap:32px;margin-top:44px;padding-top:24px;border-top:1px solid var(--line)}
.facts b{display:block;font:700 1.9rem/1 var(--hd);letter-spacing:-.04em;margin-bottom:6px}
.facts small{color:var(--dim);font-size:.8rem}

.stack{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));align-self:center}
.l1{grid-column:1/11;grid-row:1;z-index:1}
.l2{grid-column:3/13;grid-row:2;margin-top:-30px;z-index:2}
.l3{grid-column:1/10;grid-row:3;margin-top:-26px;z-index:3}
.l2 .pane{padding-bottom:44px}
.pane{padding:20px;background:linear-gradient(160deg,color-mix(in srgb,var(--a) 11%,rgba(28,35,50,.78)),rgba(18,23,34,.82) 70%)}
.pane-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.pane-h small{color:var(--dim);font-size:.76rem;font-family:var(--mono)}
.pane h3{font-size:1.2rem}
.pane p{font-size:.88rem;margin-top:6px}
.formula{font:500 1.25rem/1.4 var(--mono);color:var(--text);padding:14px 16px;border-radius:14px;background:rgba(0,0,0,.22);border:1px dashed color-mix(in srgb,var(--a) 42%,transparent);margin-top:14px;overflow-x:auto;white-space:nowrap}
.formula .v{color:var(--a)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line2);font-size:.76rem;color:var(--muted)}
.kp{list-style:none;display:grid;gap:9px;margin-top:4px}
.kp li{display:flex;gap:10px;font-size:.88rem;color:var(--text);line-height:1.45}
.kp li:before{content:"";flex:none;width:14px;height:14px;margin-top:3px;border-radius:4px;border:1.5px solid var(--a);background:linear-gradient(var(--a),var(--a)) center/6px 6px no-repeat}

/* ---------- Ticker ---------- */
.ticker{padding:22px 0;border-block:1px solid var(--line);overflow:hidden;display:grid;gap:10px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.track{display:flex;width:max-content;animation:tick 80s linear infinite}
.track.rev{animation-direction:reverse;animation-duration:95s}
.track span{display:inline-flex;align-items:center;gap:12px;padding-right:28px;font:600 clamp(1rem,2.4vw,1.4rem) var(--hd);color:var(--dim);white-space:nowrap;letter-spacing:-.02em}
.track span i{font-style:normal;font-size:.62em;font-family:var(--mono);color:var(--a);border:1px solid color-mix(in srgb,var(--a) 40%,transparent);border-radius:6px;padding:2px 6px}
@keyframes tick{to{transform:translateX(-50%)}}

/* ---------- Sections ---------- */
.section{padding:104px 0}
.sh{display:grid;gap:16px;margin-bottom:48px;max-width:680px}
.sh p{font-size:1.04rem;max-width:34em}

/* Feature bento */
.bento{display:grid;gap:14px}
.tile{padding:26px;min-height:240px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.tile h3{font-size:clamp(1.4rem,3vw,1.9rem);letter-spacing:-.035em}
.tile>p{font-size:.95rem;max-width:30em}
.tile .vis{margin-top:auto;padding-top:18px}
.big-f{font:500 clamp(2rem,6.5vw,4.6rem)/1.15 var(--mono);letter-spacing:-.03em;color:var(--text);white-space:nowrap;overflow-x:auto;padding-bottom:6px}
.big-f .v{color:var(--mint)}
.wsteps{list-style:none;display:grid;gap:8px;margin-top:18px;counter-reset:w}
.wsteps li{counter-increment:w;display:flex;gap:12px;align-items:baseline;font-size:.9rem;color:var(--muted);padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.18);border:1px solid var(--line)}
.wsteps li:before{content:"Step " counter(w);font:600 .7rem var(--mono);color:var(--mint);letter-spacing:.06em;flex:none;text-transform:uppercase}
.qa{border:1px solid var(--line2);border-radius:14px;background:rgba(0,0,0,.18);padding:14px 16px}
.qa .q{color:var(--text);font-size:.92rem;line-height:1.5}
.qa .m{display:block;font:600 .7rem var(--mono);color:var(--amber);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.qa details{margin-top:12px;border-top:1px dashed var(--line2);padding-top:10px}
.qa summary{cursor:pointer;font-size:.84rem;font-weight:600;color:var(--amber);list-style:none;display:flex;align-items:center;gap:8px}
.qa summary::-webkit-details-marker{display:none}
.qa summary:after{content:"+";font-family:var(--mono);transition:transform .3s var(--ease)}
.qa details[open] summary:after{transform:rotate(45deg)}
.qa details p{font-size:.86rem;margin-top:8px;animation:viewIn .5s var(--ease)}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchips span{font:500 .88rem var(--mono);padding:8px 12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--violet) 32%,transparent);background:color-mix(in srgb,var(--violet) 7%,transparent);color:var(--text)}
.mini-thread{display:grid;gap:8px;max-width:420px;width:100%}
.mini-thread div{padding:10px 14px;border-radius:16px;font-size:.86rem;line-height:1.45;max-width:88%}
.mini-thread .s{justify-self:end;background:rgba(255,255,255,.06);border:1px solid var(--line2);border-bottom-right-radius:6px}
.mini-thread .f{background:color-mix(in srgb,var(--mint) 12%,transparent);border:1px solid color-mix(in srgb,var(--mint) 30%,transparent);border-bottom-left-radius:6px}
.mini-thread small{display:block;font-size:.7rem;color:var(--dim);margin-top:3px}

/* Subjects: periodic-table element tiles */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stile{padding:20px;min-height:200px;display:flex;flex-direction:column;overflow:hidden}
.stile .z{display:flex;justify-content:space-between;align-items:flex-start;font:500 .78rem var(--mono);color:var(--dim)}
.stile .z b{font:600 1rem var(--mono);color:var(--a)}
.stile .sym{font:750 clamp(3.4rem,10vw,5rem)/.9 var(--hd);letter-spacing:-.06em;color:var(--a);margin:auto 0 10px}
.stile h3{font-size:1.15rem}
.stile small{color:var(--muted);font-size:.8rem}
.stile .dots{margin-top:14px}
.stile .chl{display:none}
.s0{grid-column:span 2}

/* Method timeline */
.howGrid{display:grid;gap:40px}
.loop{position:relative;padding-left:58px;display:grid;gap:16px}
.loop:before,.loop:after{content:"";position:absolute;left:19px;top:10px;width:2px;border-radius:2px}
.loop:before{bottom:10px;background:var(--line)}
.loop:after{height:calc((100% - 20px) * var(--p,0));background:linear-gradient(var(--mint),var(--amber) 50%,var(--violet))}
.lstep{padding:26px}
.lstep .n{position:absolute;left:-58px;top:24px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg);border:1px solid color-mix(in srgb,var(--a) 55%,transparent);color:var(--a);font:700 1rem var(--hd)}
.lstep h3{font-size:clamp(1.4rem,3vw,1.8rem);margin-bottom:8px;letter-spacing:-.035em}
.lstep p{font-size:.95rem}
.lstep .where{display:inline-block;margin-top:16px;font:500 .74rem var(--mono);color:var(--a);letter-spacing:.06em;text-transform:uppercase}

/* CTA */
.cta{padding:72px 24px;text-align:center;overflow:hidden;display:grid;justify-items:center;gap:18px}
.cta h2{font-size:clamp(2.3rem,7.5vw,5rem);max-width:11em}
.cta p{max-width:30em}
.cta .acts{margin-top:10px;justify-content:center}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding:28px 0 44px;margin-top:48px;border-top:1px solid var(--line);color:var(--dim);font-size:.84rem}

/* ---------- App shell ---------- */
.appLayout{padding:16px 0 56px}
.sidebar{display:none}
.main{min-width:0}
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:20px;background:rgba(22,28,40,.78);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line2);box-shadow:0 20px 40px -10px rgba(0,0,0,.6)}
.tabbar[hidden]{display:none}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;border-radius:14px;font-size:.7rem;font-weight:600;color:var(--muted)}
.tabbar a.on{color:var(--mint);background:color-mix(in srgb,var(--mint) 10%,transparent)}
.pageTop{margin-bottom:24px}
.crumb{font-size:.82rem;color:var(--dim);margin-bottom:8px}.crumb a{color:var(--mint)}
.pageTop h1{font-size:clamp(2rem,7vw,3.2rem)}
.pageTop p{font-size:.95rem;margin-top:8px}

/* Dashboard bento */
.dash{display:grid;gap:14px}
.dtile{padding:24px;overflow:hidden;display:flex;flex-direction:column}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.dh h3{font-size:1.05rem}
.d-greet{min-height:280px;padding:28px}
.d-greet .date{font:500 .74rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.d-greet h1{font-size:clamp(2.3rem,6.5vw,4rem);margin:14px 0 12px}
.d-greet h1 em{font-style:normal;color:var(--mint)}
.d-greet p{max-width:30em}
.d-greet .acts{margin-top:auto;padding-top:28px}
.statrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.statrow:first-of-type{border-top:0}
.statrow b{font:700 2.4rem/1 var(--hd);letter-spacing:-.05em;color:var(--a);font-variant-numeric:tabular-nums}
.statrow span{color:var(--muted);font-size:.86rem}
.srow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.el{--a:var(--mint);width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font:700 1.05rem var(--hd);letter-spacing:-.04em;color:var(--a);border:1px solid color-mix(in srgb,var(--a) 45%,transparent);background:color-mix(in srgb,var(--a) 9%,transparent)}

function chrome(p){
  const priv=PRIVATE.includes(p);
  $('#nav').innerHTML=`<a class="brand" href="${me&&priv?'#/app':'#/'}">${LOGO}EdgeStudy</a>
  ${me?`${priv?'':'<a class="btn sm primary" href="#/app">Study space</a>'}<a class="av" href="#/profile" aria-label="Profile">${esc((dname()||me.email)[0].toUpperCase())}</a>`
  :`<nav class="navl" aria-label="Sections"><a href="#/" onclick="event.preventDefault();jump('features')">Features</a><a href="#/" onclick="event.preventDefault();jump('subjects')">Subjects</a><a href="#/" onclick="event.preventDefault();jump('how')">Method</a></nav><a class="btn sm" href="#/login">Log in</a><a class="btn sm primary" href="#/signup">Get started</a>`}`;
  const tb=$('#tabbar'),show=!!me&&priv;tb.hidden=!show;document.body.classList.toggle('hasTab',show);
  const T=(h,k,i,t)=>`<a class="${onTab(p,k)?'on':''}" href="${h}"${onTab(p,k)?' aria-current="page"':''}>${ic(i)}<span>${t}</span></a>`;
  tb.innerHTML=T('#/app','app','home','Home')+T('#/subjects','subjects','book','Subjects')+T('#/help','help','help','Report')+T('#/profile','profile','user','Profile');
}
function jump(id){if((location.hash||'#/')!=='#/'){go('#/');setTimeout(()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth'}),80)}else document.getElementById(id)?.scrollIntoView({behavior:'smooth'})}
function shell(p,inner){
  const L=(h,k,i,t)=>`<a class="${onTab(p,k)?'on':''}" href="${h}"${onTab(p,k)?' aria-current="page"':''}>${ic(i)}${t}</a>`;
  view.innerHTML=`<div class="wrap appLayout"><aside class="sidebar" aria-label="Study space"><span class="side-label">Study space</span>${L('#/app','app','home','Dashboard')}${L('#/subjects','subjects','book','My subjects')}${L('#/help','help','help','Report a gap')}${L('#/profile','profile','user','Profile')}<span class="side-sep"></span><button id="so">${ic('out')}Log out</button></aside><main class="main" data-auto>${inner}</main></div>`;
  $('#so').onclick=()=>sb.auth.signOut().then(()=>go('#/'));
}
function route(){
  if(rt){sb.removeChannel(rt);rt=null}
  const [,p='',a,b,c]=(location.hash||'#/').split('/');
  chrome(p);scrollTo(0,0);
  view.classList.remove('enter');void view.offsetWidth;view.classList.add('enter');
  if(!sb&&p!==''){view.innerHTML='<div class="wrap authGrid"><div class="card empty"><h3>Service unavailable</h3><p>Could not connect. Check your internet connection and reload.</p></div></div>';return}
  if(PRIVATE.includes(p)&&!me)return go('#/login');
  ({'':landing,login:()=>auth('login'),signup:()=>auth('signup'),app:dashboard,subjects:()=>subjects(a),c:()=>chapter(a,b,c),help,ticket:()=>ticket(a),profile}[p]||landing)();
}

function auth(mode){
  if(me)return go('#/app');
  const su=mode==='signup';
  view.innerHTML=`<div class="wrap authGrid"><div class="pitch rv" data-rv="left"><div><span class="eyebrow"><span class="dot"></span>Your study space</span><h1 class="split">${words('Make room for')} <em>${words('better learning.',3)}</em></h1><p>A calm, clear way to prepare for your Class 12 board exams.</p><ul data-stagger><li class="rv">Subject-wise study</li><li class="rv">Important questions</li><li class="rv">Quick revision notes</li><li class="rv">Tell us what is missing</li></ul></div></div>
  <form class="card rv" data-rv="scale" style="--i:1" id="f"><h2>${su?'Create your account':'Welcome back'}</h2><p style="margin-top:6px">${su?'Start your board preparation in under a minute.':'Log in to continue studying.'}</p>
  ${su?'<label for="n">Full name</label><input id="n" required maxlength="60" autocomplete="name">':''}
  <label for="e">Email</label><input id="e" type="email" required autocomplete="email" inputmode="email">
  ${pwf('p','Password',su?'new-password':'current-password')}${su?pwf('p2','Confirm password','new-password')+'<div class="hint" id="h" aria-live="polite"></div>':''}
  <button class="btn primary block" id="go">${su?'Create account':'Log in'}</button><div class="msg" id="m" role="alert" hidden></div>
  <p style="text-align:center;margin-top:16px;font-size:.92rem">${su?'Already have an account? <a class="tl" href="#/login">Log in</a>':'New here? <a class="tl" href="#/signup">Create an account</a>'}</p></form></div>`;
  if(su){const chk=()=>{const h=$('#h'),a=$('#p').value,b=$('#p2').value;if(!b){h.textContent='';return}const ok=a===b;h.className='hint '+(ok?'ok':'err');h.textContent=ok?'Passwords match':'Passwords do not match'};$('#p').oninput=$('#p2').oninput=chk}
  $('#f').onsubmit=async e=>{e.preventDefault();const b=$('#go'),m=$('#m'),pw=$('#p').value;
    if(su&&pw!==$('#p2').value)return say(m,'Passwords do not match. Please re-enter them.');
    b.disabled=true;const em=$('#e').value.trim();
    const r=su?await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:$('#n').value.trim()}}}):await sb.auth.signInWithPassword({email:em,password:pw});
    b.disabled=false;if(r.error)return say(m,r.error.message);
    if(su&&!r.data.session)return say(m,'Account created. Check your email to confirm it, then log in.','ok');
    go('#/app')};
}

/* ---------- Subjects and chapters ---------- */
function subjects(name){
  const s=name&&sub(decodeURIComponent(name));
  if(!s){shell('subjects',`<div class="pageTop"><h1>Your subjects</h1><p>Choose a subject to see its chapters.</p></div><div class="subjectList norv" data-stagger>${SUBJECTS.map(x=>`<a class="sc tint rv" data-rv="scale" style="--a:${x.c}" href="#/subjects/${encodeURIComponent(x.n)}"><span class="el" style="--a:${x.c}" aria-hidden="true">${x.i}</span><span><strong>${x.n}</strong><small>${x.ch.length} chapters</small></span><span class="go" aria-hidden="true">${ic('arrow')}</span></a>`).join('')}</div>`);return}
  const has=(c,t)=>CONTENT[`${s.n}|${c}|${t}`];
  shell('subjects',`<div class="pageTop"><div class="crumb"><a href="#/subjects">Subjects</a> / ${esc(s.n)}</div><h1>${esc(s.n)}</h1><p>${s.ch.length} chapters. Open a chapter for theory, questions and revision.</p></div>
  <div class="chapterGrid norv" data-stagger>${s.ch.map((c,i)=>{const live=TABS.some(([t])=>has(c,t));return `<article class="cc rv" data-rv="scale" style="--a:${s.c}"><div class="no">Chapter ${pad(i+1)}</div><h3>${esc(c)}</h3><div class="ft"><small>${live?'Notes available':'Notes coming soon'}</small><a class="btn sm ${live?'primary':''}" href="#/c/${encodeURIComponent(s.n)}/${i}/theory">Open</a></div></article>`}).join('')}</div>`);
}
async function chapter(sn,idx,tab){
  const s=sub(decodeURIComponent(sn||'')),i=Number(idx);
  if(!s||!(i>=0&&i<s.ch.length))return go('#/subjects');
  tab=TABS.some(t=>t[0]===tab)?tab:'theory';const c=s.ch[i],base=`#/c/${encodeURIComponent(s.n)}/`;
  shell('c',`<div class="pageTop"><div class="crumb"><a href="#/subjects">Subjects</a> / <a href="#/subjects/${encodeURIComponent(s.n)}">${esc(s.n)}</a></div><h1>${esc(c)}</h1><p>Chapter ${i+1} of ${s.ch.length}</p></div>
  <div class="tabs" role="tablist">${TABS.map(([k,l])=>`<a class="tab ${k===tab?'on':''}" href="${base}${i}/${k}"${k===tab?' aria-current="page"':''}>${l}</a>`).join('')}</div>
  <article class="lesson" id="les"><p>Loading...</p></article>
  <div class="pn">${i>0?`<a class="btn" href="${base}${i-1}/${tab}">&larr; Previous</a>`:'<span></span>'}${i<s.ch.length-1?`<a class="btn" href="${base}${i+1}/${tab}">Next &rarr;</a>`:''}</div>`);
  const box=$('#les'),u=CONTENT[`${s.n}|${c}|${tab}`],label=TABS.find(t=>t[0]===tab)[1];
  if(!u){box.innerHTML=`<div class="empty"><h3>${label} is coming soon</h3><p>This section is being prepared and will appear here as soon as it is published.</p><a class="btn" href="#/help">Report a gap</a></div>`;return}
  try{const r=await fetch(u);if(!r.ok)throw 0;box.innerHTML=await r.text()}catch(e){box.innerHTML='<div class="empty"><h3>Could not load this section</h3><p>Check your connection and try again.</p></div>'}
}

/* ---------- Media ---------- */
async function upload(file,tid){
  const path=`${me.id}/${tid}/${Date.now()}-${file.name.replace(/[^\w.-]/g,'_')}`;
  const {error}=await sb.storage.from('ticket-media').upload(path,file,{contentType:file.type});if(error)throw error;return{path,type:file.type};
}
async function media(path,type){
  if(!path)return'';const {data}=await sb.storage.from('ticket-media').createSignedUrl(path,3600);const u=data?.signedUrl;if(!u)return'';
  return type?.startsWith('image')?`<img src="${u}" alt="Attachment" loading="lazy">`:type?.startsWith('video')?`<video src="${u}" controls playsinline></video>`:`<a class="tl" href="${u}" target="_blank" rel="noopener">Open attachment</a>`;
}

  <form class="box" id="f"><label for="sj" style="margin-top:0">Subject</label><select id="sj">${SUBJECTS.map(x=>`<option>${x.n}</option>`).join('')}<option>General</option></select>
   <label for="s">What is missing?</label><input id="s" required maxlength="100" placeholder="e.g. Numericals for the Nuclei chapter">
   <label for="b">Details</label><textarea id="b" required placeholder="Tell us what is lacking and what would help you."></textarea>
   <label for="fi">Screenshot, photo or video (optional)</label><div class="btn file block">Choose file<input type="file" id="fi" accept="image/*,video/*"></div><small id="fn" style="color:var(--muted)"></small>
   <button class="btn primary block" id="go">Send report</button><div class="msg" id="m" role="alert" hidden></div></form>
  <h3 style="margin:24px 0 12px">Your reports</h3><div class="norv" data-stagger>${ts?.length?ts.map(t=>`<a class="tk rv" href="#/ticket/${t.id}"><span><b>${esc(t.subject)}</b><br><small>${fmt(t.created_at)}</small></span><span class="st ${t.status}">${SL[t.status]||t.status}</span></a>`).join(''):'<div class="box empty rv"><p style="margin:0 auto">No reports yet. Anything you send will show up here.</p></div>'}</div>`);
  $('#fi').onchange=e=>$('#fn').textContent=e.target.files[0]?.name||'';
  $('#f').onsubmit=async e=>{e.preventDefault();const b=$('#go'),m=$('#m');b.disabled=true;
    try{const {data:t,error}=await sb.from('tickets').insert({user_id:me.id,subject:`${$('#sj').value} \u00b7 ${$('#s').value.trim()}`}).select().single();if(error)throw error;
      const f=$('#fi').files[0],up=f?await upload(f,t.id):{};
      const r=await sb.from('ticket_messages').insert({ticket_id:t.id,sender_id:me.id,body:$('#b').value.trim(),media_path:up.path,media_type:up.type});if(r.error)throw r.error;go('#/ticket/'+t.id);
    }catch(x){say(m,x.message);b.disabled=false}};
}

/* ---------- Ticket thread ---------- */
async function ticket(id){
  const {data:t,error}=await sb.from('tickets').select('*').eq('id',id).maybeSingle();
  if(error||!t){shell('help','<div class="box empty"><h3>Report not found</h3><p>It may have been removed.</p><a class="btn" href="#/help">Back to reports</a></div>');return}
  const canType=t.chat_enabled&&t.status!=='closed';
  shell('ticket',`<div class="crumb"><a href="#/help">&larr; All reports</a></div>
  <div class="row" style="margin-top:8px"><h2>${esc(t.subject)}</h2><span class="st ${t.status}">${SL[t.status]||t.status}</span></div><div class="thread norv" id="th" aria-live="polite"></div>
  ${canType?`<form class="comp" id="cf"><textarea id="cb" required placeholder="Write your reply" aria-label="Your reply"></textarea><div class="btn file">Add media<input type="file" id="cfi" accept="image/*,video/*" aria-label="Add media"></div><button class="btn primary">Send</button><small id="cfn" style="color:var(--muted)"></small></form>`:`<div class="lock">${t.status==='closed'?'This report is closed. Thank you for helping us improve.':'Nothing more is needed from you right now. If we need more details, chat will be turned on here and you can reply.'}</div>`}`);
  const th=$('#th');
  const add=async m=>{const d=document.createElement('div');d.className='b '+(m.is_founder?'f':'me');
    d.innerHTML=`${esc(m.body).replace(/\n/g,'<br>')}${await media(m.media_path,m.media_type)}<small>${m.is_founder?'Founder':'You'} &middot; ${fmt(m.created_at)}</small>`;th.appendChild(d)};
  const {data:ms}=await sb.from('ticket_messages').select('*').eq('ticket_id',id).order('created_at');
  for(const m of ms||[])await add(m);
  const seen=new Set((ms||[]).map(m=>m.id));
  rt=sb.channel('t'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'ticket_messages',filter:`ticket_id=eq.${id}`},p=>{if(!seen.has(p.new.id)){seen.add(p.new.id);add(p.new)}})
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'tickets',filter:`id=eq.${id}`},()=>ticket(id)).subscribe();
  $('#cfi')&&($('#cfi').onchange=e=>$('#cfn').textContent=e.target.files[0]?.name||'');
  $('#cf')&&($('#cf').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;
    try{const f=$('#cfi').files[0],up=f?await upload(f,id):{};
      const {data:m,error}=await sb.from('ticket_messages').insert({ticket_id:id,sender_id:me.id,is_founder:false,body:$('#cb').value.trim(),media_path:up.path,media_type:up.type}).select().single();
      if(error)throw error;seen.add(m.id);await add(m);$('#cb').value='';$('#cfi').value='';$('#cfn').textContent='';
    }catch(x){alert(x.message)}btn.disabled=false});
}

runIntro(init().catch(e=>{console.error(e);route()}));
</script>
</body>
</html>
